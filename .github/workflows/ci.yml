name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint (pyflakes)
        run: python -m pip install pyflakes && python -m pyflakes simple-ytdlp.py tests docs
      - name: Unit tests (the window tests skip themselves without a display)
        run: python -m unittest discover -s tests -v

  # The real window under a virtual display: queue, selection, pause/resume, automatic retries (fake yt-dlp)
  # and the end-to-end resume tests against a local HTTP server (real yt-dlp).
  gui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: System packages (Tk, virtual display, a font)
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb fonts-dejavu-core
      - name: Dependencies
        run: python -m pip install sv-ttk pillow darkdetect certifi yt-dlp imageio-ffmpeg tkinterdnd2
      - name: Window tests
        run: xvfb-run -a -s "-screen 0 1280x1024x24" python -X faulthandler -m unittest discover -s tests -v
      - name: README screenshots still build
        run: xvfb-run -a -s "-screen 0 1800x1100x24" python docs/make_screenshots.py dark
