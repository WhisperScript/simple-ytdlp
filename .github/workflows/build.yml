name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest          # Apple Silicon (M1/M2/M3/...)
            name: macos
          - os: macos-15-intel        # Intel Macs
            name: macos-intel
          - os: ubuntu-22.04          # older glibc -> also runs on older distros
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set version from tag (v1.2 -> 1.2)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          sed -i.bak "s/^__version__ = .*/__version__ = \"${GITHUB_REF_NAME#v}\"/" ytdl.py
          grep '^__version__' ytdl.py

      - name: Tk on Linux
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Dependencies
        run: python -m pip install pyinstaller imageio-ffmpeg certifi sv-ttk darkdetect pillow

      - name: Build (Windows/Linux - single file)
        if: ${{ !startsWith(matrix.name, 'macos') }}
        run: pyinstaller --onefile --windowed --name ytdl --collect-all imageio_ffmpeg --collect-all sv_ttk ytdl.py

      - name: Build (macOS - .app bundle)
        if: startsWith(matrix.name, 'macos')
        run: pyinstaller --windowed --name ytdl --collect-all imageio_ffmpeg --collect-all sv_ttk ytdl.py

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/ytdl.exe -DestinationPath ytdl-windows.zip

      - name: Package (macOS)
        if: startsWith(matrix.name, 'macos')
        run: cd dist && zip -ry ../ytdl-${{ matrix.name }}.zip ytdl.app

      - name: Package (Linux)
        if: matrix.name == 'linux'
        run: cd dist && tar czf ../ytdl-linux.tar.gz ytdl

      - uses: actions/upload-artifact@v4
        with:
          name: ytdl-${{ matrix.name }}
          path: ytdl-*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: ytdl-*
