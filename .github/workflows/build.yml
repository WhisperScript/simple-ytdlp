name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Publish a release with this tag, e.g. v2.0 (leave empty to only build artifacts)"
        required: false
        default: ""
      notes:
        description: "Release notes (optional; generated notes are appended)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Release tag (pushed tag or manual input)
        id: ver
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; fi
          if [ -n "$TAG" ] && ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Tag must look like v1.2 or v2.0, got: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest          # Apple Silicon (M1/M2/M3/...)
            name: macos
          - os: macos-15-intel        # Intel Macs
            name: macos-intel
          - os: ubuntu-22.04          # older glibc -> also runs on older distros
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set version from tag (v1.2 -> 1.2)
        if: ${{ needs.prepare.outputs.tag != '' }}
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          sed -i.bak "s/^__version__ = .*/__version__ = \"${TAG#v}\"/" simple-ytdlp.py
          grep '^__version__' simple-ytdlp.py

      - name: Tk on Linux
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Dependencies
        run: python -m pip install pyinstaller imageio-ffmpeg certifi sv-ttk darkdetect pillow tkinterdnd2

      - name: App icon (png, ico, icns)
        run: python simple-ytdlp.py --make-icons build-assets

      - name: Build (Windows - single file)
        if: matrix.name == 'windows'
        run: pyinstaller --onefile --windowed --name simple-ytdlp --icon build-assets/icon.ico --collect-all imageio_ffmpeg --collect-all sv_ttk --collect-all tkinterdnd2 simple-ytdlp.py

      - name: Build (Linux - single file)
        if: matrix.name == 'linux'
        run: pyinstaller --onefile --windowed --name simple-ytdlp --collect-all imageio_ffmpeg --collect-all sv_ttk --collect-all tkinterdnd2 simple-ytdlp.py

      - name: Build (macOS - .app bundle)
        if: startsWith(matrix.name, 'macos')
        run: pyinstaller --windowed --name simple-ytdlp --icon build-assets/icon.icns --collect-all imageio_ffmpeg --collect-all sv_ttk --collect-all tkinterdnd2 simple-ytdlp.py

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/simple-ytdlp.exe -DestinationPath simple-ytdlp-windows.zip

      - name: Package (macOS)
        if: startsWith(matrix.name, 'macos')
        run: cd dist && zip -ry ../simple-ytdlp-${{ matrix.name }}.zip simple-ytdlp.app

      - name: Package (Linux)
        if: matrix.name == 'linux'
        run: cd dist && tar czf ../simple-ytdlp-linux.tar.gz simple-ytdlp

      - uses: actions/upload-artifact@v7
        with:
          name: simple-ytdlp-${{ matrix.name }}
          path: simple-ytdlp-*

  # The browser extension (Chrome Web Store / Edge Add-ons package).
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python extension/store/pack.py simple-ytdlp-extension.zip
      - uses: actions/upload-artifact@v7
        with:
          name: simple-ytdlp-extension
          path: simple-ytdlp-extension.zip

  release:
    if: ${{ needs.prepare.outputs.tag != '' }}
    needs: [prepare, build, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: ${{ inputs.notes }}
          generate_release_notes: true
          files: simple-ytdlp-*
