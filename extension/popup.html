<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>simple-ytdlp</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <img src="icons/icon32.png" width="24" height="24" alt="">
      <strong>simple-ytdlp</strong>
    </header>
    <p id="page" class="page"></p>
    <div id="state" class="state wait" role="status" aria-live="polite">
      <span id="mark" class="mark" aria-hidden="true"></span>
      <span id="message">Sending …</span>
    </div>
    <div id="actions" class="actions"></div>
    <footer><a id="settings" href="#">Settings</a></footer>
  </main>
  <script src="client.js"></script>
  <script src="popup.js"></script>
</body>
</html>
